server:
  port: 8082

spring:
  application:
    name: case-service
  config:
    import: "optional:configserver:http://localhost:8888"
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/case_db
    username: lawforyou
    password: lawforyou
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.lawforyou.*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Phase 5: JWT validation moved to api-gateway (DualTokenAuthenticationFilter).
# case-service now trusts X-User-ID / X-Tenant-ID headers injected by the gateway.
# app.jwt.* properties are no longer needed here.
app:
  outbox:
    relay-delay-ms: 5000

