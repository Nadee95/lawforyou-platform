# Shared defaults delivered to every service that connects to this Config Server.
# Services can override any key in their own <service-name>.yml file.
# NOTE: hostnames here are Docker container/service names — works when all services
#       run in Docker on lawforyou-net. For local IDE dev, services use their own
#       application.yml (no config server needed).

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0   # 100% in dev — reduce to 0.1 in production
  zipkin:
    tracing:
      endpoint: http://lawforyou-jaeger:9411/api/v2/spans

logging:
  level:
    root: INFO
    com.lawforyou: DEBUG

# ── JWT — ONE source of truth for all services ───────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:lawforyou-dev-secret-change-in-production-must-be-32chars}
    expiration-ms: 86400000   # 24 hours

