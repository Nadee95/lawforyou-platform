# Config Server — document-service overrides
# Hostnames are Docker service/container names on lawforyou-net.

spring:
  data:
    mongodb:
      uri: mongodb://lawforyou-mongodb:27017/document_db
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8083

app:
  minio:
    endpoint: http://lawforyou-minio:9000
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket-name: lawforyou-documents
  outbox:
    relay-delay-ms: 5000

