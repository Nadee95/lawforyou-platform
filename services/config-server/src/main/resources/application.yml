server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    active: native   # uses classpath /config folder for local dev; switch to 'git' for production

  cloud:
    config:
      server:
        native:
          # Classpath location where service-specific yml files live
          search-locations: classpath:/config
        # --- Git profile (uncomment for production) ---
        # git:
        #   uri: https://github.com/Nadee95/lawforyou-config
        #   default-label: main
        #   clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.lawforyou: DEBUG

