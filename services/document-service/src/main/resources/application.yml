server:
  port: 8083

spring:
  application:
    name: document-service
  config:
    import: "optional:configserver:http://localhost:8888"
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  data:
    mongodb:
      uri: mongodb://localhost:27017/document_db
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # Defaults provided by nadeex-spring-observability (actuator endpoints, health details, 100% sampling)
  # Override here only if you need non-default values:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Phase 5: JWT validation moved to api-gateway (DualTokenAuthenticationFilter).
# document-service now trusts X-User-ID / X-Tenant-ID headers injected by the gateway.
# app.jwt.* properties are no longer needed here.
app:
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: lawforyou-documents
  outbox:
    relay-delay-ms: 5000

