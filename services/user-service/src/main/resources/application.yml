server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:http://localhost:8888"
  profiles:
    active: dev

  # Override here for local dev without Config Server
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: lawforyou
    password: lawforyou
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

lawforyou:
  security:
    jwt:
      secret: local-dev-secret-change-in-production-must-be-256-bits
      expiration-ms: 86400000

