server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:http://localhost:8888"
  profiles:
    active: dev

  # Override here for local dev without Config Server
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: lawforyou
    password: lawforyou
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration   # schema + essential data only; dev seeds added via application-dev.yml
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false   # keeps messages clean; consumer uses explicit type mapping
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.lawforyou.*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # Defaults provided by nadeex-spring-observability (actuator endpoints, health details, 100% sampling)
  # Override here only if you need non-default values:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# JWT config is served by Config Server (config-server/resources/config/application.yml).
# For local dev without Config Server, set env var: JWT_SECRET=lawforyou-dev-secret-change-in-production-must-be-32chars
app:
  jwt:
    secret: ${JWT_SECRET:lawforyou-dev-secret-change-in-production-must-be-32chars}
    expiration-ms: 86400000
  keycloak:
    # Set enabled=true to activate Keycloak Admin API integration.
    # Requires Keycloak to be running and the lawforyou realm imported.
    # Keep false in tests and local dev without Keycloak.
    enabled: ${KEYCLOAK_ENABLED:false}
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:lawforyou}
    client-id: ${KEYCLOAK_CLIENT_ID:lawforyou-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:lawforyou-backend-secret}
  outbox:
    relay-delay-ms: 5000   # how often OutboxRelay polls for PENDING events (ms)

