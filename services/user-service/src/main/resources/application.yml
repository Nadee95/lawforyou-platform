server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:http://localhost:8888"
  profiles:
    active: dev

  # Override here for local dev without Config Server
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: lawforyou
    password: lawforyou
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false   # keeps messages clean; consumer uses explicit type mapping
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.lawforyou.*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# JWT config is served by Config Server (config-server/resources/config/application.yml).
# For local dev without Config Server, set env var: JWT_SECRET=lawforyou-dev-secret-change-in-production-must-be-32chars
app:
  jwt:
    secret: ${JWT_SECRET:lawforyou-dev-secret-change-in-production-must-be-32chars}
    expiration-ms: 86400000
  outbox:
    relay-delay-ms: 5000   # how often OutboxRelay polls for PENDING events (ms)

