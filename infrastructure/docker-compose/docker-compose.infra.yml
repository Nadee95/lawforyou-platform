# Infrastructure only — start this first before any service.
# Usage: docker-compose -f docker-compose.infra.yml up -d


services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lawforyou-postgres
    networks:
      - lawforyou-net
    environment:
      POSTGRES_USER: lawforyou
      POSTGRES_PASSWORD: lawforyou
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawforyou"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lawforyou-redis
    ports:
      - "6379:6379"
    networks:
      - lawforyou-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper (required by Kafka) ─────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: lawforyou-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - lawforyou-net

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: lawforyou-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - lawforyou-net

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: lawforyou-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - lawforyou-net

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: lawforyou-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-jvm-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - lawforyou-net

  # ── Jaeger (all-in-one, Zipkin-compatible endpoint) ────────
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: lawforyou-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"   # enable Zipkin-compatible HTTP receiver
    ports:
      - "16686:16686"   # Jaeger UI
      - "9411:9411"     # Zipkin-compatible endpoint (used by Micrometer Tracing)
    networks:
      - lawforyou-net

  # ── MongoDB (document-service metadata) ──────────────────
  mongodb:
    image: mongo:7
    container_name: lawforyou-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: document_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - lawforyou-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    container_name: lawforyou-minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # S3 API
      - "9091:9091"    # MinIO Console UI
    volumes:
      - minio_data:/data
    networks:
      - lawforyou-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mailhog (local SMTP sink for communication-service dev) ──────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: lawforyou-mailhog
    ports:
      - "1025:1025"   # SMTP — communication-service sends here
      - "8025:8025"   # Web UI — view captured emails at http://localhost:8025
    networks:
      - lawforyou-net

  # ── Keycloak (SSO / OAuth2 Identity Provider — Phase 2+) ─────────────
  # Admin UI  : http://localhost:8180  (admin / admin)
  # Realm     : lawforyou
  # JWKS URI  : http://localhost:8180/realms/lawforyou/protocol/openid-connect/certs
  # Token URL : http://localhost:8180/realms/lawforyou/protocol/openid-connect/token
  #
  # start-dev is for local development only.
  # Use `start` with proper TLS + hostname settings for staging/production.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lawforyou-keycloak
    entrypoint: ["/opt/keycloak/realm-template/docker-entrypoint.sh"]
    command: start-dev --import-realm
    environment:
      # PostgreSQL backend (keycloak_db created by init-db.sql)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-lawforyou}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-lawforyou}
      # Admin credentials
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      # Dev-mode network settings
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Realm import secrets — resolved by docker-entrypoint.sh via envsubst
      KC_BACKEND_CLIENT_SECRET: ${KC_BACKEND_CLIENT_SECRET:?KC_BACKEND_CLIENT_SECRET is required}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD is required}
      KC_LAWYER_PASSWORD: ${KC_LAWYER_PASSWORD:?KC_LAWYER_PASSWORD is required}
      KC_CLIENT_PASSWORD: ${KC_CLIENT_PASSWORD:?KC_CLIENT_PASSWORD is required}
    ports:
      - "8180:8080"   # Keycloak HTTP (main)
      - "9180:9000"   # Keycloak management (health, metrics)
    volumes:
      # Template (with ${...} placeholders) — entrypoint resolves it at startup
      - ../keycloak:/opt/keycloak/realm-template:ro
      # Import dir — resolved realm-export.json written here by entrypoint (ephemeral)
      - keycloak_import:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lawforyou-net
    healthcheck:
      # Health is on the management interface (port 9000), NOT the main port (8080)
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s   # Keycloak takes ~60 s on first boot with DB migration

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  mongodb_data:
  minio_data:
  keycloak_import:   # ephemeral — holds the envsubst-resolved realm file at runtime

networks:
  lawforyou-net:
    name: lawforyou-net
    driver: bridge
