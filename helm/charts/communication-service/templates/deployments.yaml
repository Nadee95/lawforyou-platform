{{- $name := include "communication-service.fullname" . -}}
{{- range list "blue" "green" }}
{{- $slot := . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $slot }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "communication-service.labels" $ | nindent 4 }}
    slot: {{ $slot }}
spec:
  replicas: {{ if eq $slot $.Values.activeSlot }}{{ $.Values.replicaCount }}{{ else }}{{ if (hasKey $.Values "inactiveReplicaCount") }}{{ index $.Values "inactiveReplicaCount" }}{{ else }}{{ $.Values.replicaCount }}{{ end }}{{ end }}
  selector:
    matchLabels:
      {{- include "communication-service.selectorLabels" $ | nindent 6 }}
      slot: {{ $slot }}
  template:
    metadata:
      labels:
        {{- include "communication-service.selectorLabels" $ | nindent 8 }}
        slot: {{ $slot }}
    spec:
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: communication-service
          image: "{{ $.Values.image.repository }}:{{ index $.Values $slot "image" "tag" }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: 8084
              protocol: TCP
          env:
            {{- range $key, $val := $.Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: SMTP_PASS
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: EMAIL_FROM
          startupProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 50
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}



