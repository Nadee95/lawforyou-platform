activeSlot: blue

blue:
  image:
    tag: "0.1.0"

green:
  image:
    tag: "0.1.0"

image:
  repository: ghcr.io/nadee95/lawforyou/api-gateway
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: lawforyou-ghcr-pull-secret

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

secrets:
  existingSecret: lawforyou-gateway-secret

env:
  SPRING_PROFILES_ACTIVE: "docker"
  JAVA_OPTS: "-Xms192m -Xmx384m"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"

