{{- $name := include "document-service.fullname" . -}}
{{- range list "blue" "green" }}
{{- $slot := . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $slot }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "document-service.labels" $ | nindent 4 }}
    slot: {{ $slot }}
spec:
  replicas: {{ if eq $slot $.Values.activeSlot }}{{ $.Values.replicaCount }}{{ else }}{{ if (hasKey $.Values "inactiveReplicaCount") }}{{ index $.Values "inactiveReplicaCount" }}{{ else }}{{ $.Values.replicaCount }}{{ end }}{{ end }}
  selector:
    matchLabels:
      {{- include "document-service.selectorLabels" $ | nindent 6 }}
      slot: {{ $slot }}
  template:
    metadata:
      labels:
        {{- include "document-service.selectorLabels" $ | nindent 8 }}
        slot: {{ $slot }}
    spec:
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: document-service
          image: "{{ $.Values.image.repository }}:{{ index $.Values $slot "image" "tag" }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: 8083
              protocol: TCP
          env:
            {{- range $key, $val := $.Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: MONGODB_URI
            - name: APP_MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: MINIO_ENDPOINT
            - name: APP_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: MINIO_ACCESS_KEY
            - name: APP_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: MINIO_SECRET_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: JWT_SECRET
          startupProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 50
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}



