name: CD — communication-service

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/nadee95/lawforyou/communication-service
  SERVICE: communication-service
  HELM_CHART: helm/charts/communication-service

jobs:
  build-and-deploy:
    name: Build, Push & Blue-Green Deploy communication-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lawforyou-platform/services/communication-service/package-lock.json

      - name: Read app version
        id: version
        working-directory: lawforyou-platform/services/communication-service
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: lawforyou-platform/services/communication-service
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Determine inactive slot
        id: slot
        working-directory: lawforyou-platform
        run: |
          ACTIVE=$(helm get values ${{ env.SERVICE }} -n lawforyou -o json 2>/dev/null | jq -r '.activeSlot // "blue"')
          INACTIVE=$([[ "$ACTIVE" == "blue" ]] && echo "green" || echo "blue")
          echo "active=$ACTIVE"   >> $GITHUB_OUTPUT
          echo "inactive=$INACTIVE" >> $GITHUB_OUTPUT

      - name: Deploy new image to inactive slot
        working-directory: lawforyou-platform
        run: |
          helm upgrade --install ${{ env.SERVICE }} ${{ env.HELM_CHART }} \
            --namespace lawforyou \
            --set ${{ steps.slot.outputs.inactive }}.image.tag=${{ steps.version.outputs.tag }} \
            --reuse-values \
            --wait --timeout 3m

      - name: Wait for inactive slot to be ready
        run: |
          kubectl rollout status deployment/${{ env.SERVICE }}-${{ steps.slot.outputs.inactive }} \
            -n lawforyou --timeout=3m

      - name: Flip traffic to new slot
        working-directory: lawforyou-platform
        run: |
          helm upgrade ${{ env.SERVICE }} ${{ env.HELM_CHART }} \
            --namespace lawforyou \
            --set activeSlot=${{ steps.slot.outputs.inactive }} \
            --reuse-values

      - name: Confirm active slot
        run: |
          echo "✅ Traffic now routing to slot: ${{ steps.slot.outputs.inactive }}"
          echo "   Image: ${{ steps.version.outputs.tag }}"

