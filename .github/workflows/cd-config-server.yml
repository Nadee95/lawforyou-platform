name: CD — config-server

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/nadee95/lawforyou/config-server
  SERVICE: config-server
  HELM_CHART: helm/charts/config-server

jobs:
  build-and-deploy:
    name: Build, Push & Deploy config-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.gradle
          echo "gpr.user=${{ github.actor }}" >> ~/.gradle/gradle.properties
          echo "gpr.key=${{ secrets.GITHUB_TOKEN }}" >> ~/.gradle/gradle.properties

      - name: Read app version
        id: version
        working-directory: lawforyou-platform
        run: |
          VERSION=$(./gradlew :services:config-server:properties -q --no-daemon | grep "^version:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build bootJar
        working-directory: lawforyou-platform
        run: ./gradlew :services:config-server:bootJar --no-daemon

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: lawforyou-platform/services/config-server
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Deploy (rolling update — no blue-green for infra-tier)
        working-directory: lawforyou-platform
        run: |
          helm upgrade --install ${{ env.SERVICE }} ${{ env.HELM_CHART }} \
            --namespace lawforyou \
            --set image.tag=${{ steps.version.outputs.tag }} \
            --wait --timeout 3m

      - name: Verify rollout
        run: kubectl rollout status deployment/${{ env.SERVICE }} -n lawforyou --timeout=3m

