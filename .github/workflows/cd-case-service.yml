name: CD — case-service

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/nadee95/lawforyou/case-service
  SERVICE: case-service
  HELM_CHART: helm/charts/case-service

jobs:
  build-and-deploy:
    name: Build, Push & Blue-Green Deploy case-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.gradle
          echo "gpr.user=${{ github.actor }}" >> ~/.gradle/gradle.properties
          echo "gpr.key=${{ secrets.GITHUB_TOKEN }}" >> ~/.gradle/gradle.properties

      - name: Read app version
        id: version
        working-directory: lawforyou-platform
        run: |
          VERSION=$(./gradlew :services:case-service:properties -q --no-daemon | grep "^version:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build bootJar
        working-directory: lawforyou-platform
        run: ./gradlew :services:case-service:bootJar --no-daemon

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: lawforyou-platform/services/case-service
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Determine inactive slot
        id: slot
        working-directory: lawforyou-platform
        run: |
          ACTIVE=$(helm get values ${{ env.SERVICE }} -n lawforyou -o json 2>/dev/null | jq -r '.activeSlot // "blue"')
          INACTIVE=$([[ "$ACTIVE" == "blue" ]] && echo "green" || echo "blue")
          echo "active=$ACTIVE"   >> $GITHUB_OUTPUT
          echo "inactive=$INACTIVE" >> $GITHUB_OUTPUT

      - name: Deploy new image to inactive slot
        working-directory: lawforyou-platform
        run: |
          helm upgrade --install ${{ env.SERVICE }} ${{ env.HELM_CHART }} \
            --namespace lawforyou \
            --set ${{ steps.slot.outputs.inactive }}.image.tag=${{ steps.version.outputs.tag }} \
            --reuse-values \
            --wait --timeout 3m

      - name: Wait for inactive slot to be ready
        run: |
          kubectl rollout status deployment/${{ env.SERVICE }}-${{ steps.slot.outputs.inactive }} \
            -n lawforyou --timeout=3m

      - name: Flip traffic to new slot
        working-directory: lawforyou-platform
        run: |
          helm upgrade ${{ env.SERVICE }} ${{ env.HELM_CHART }} \
            --namespace lawforyou \
            --set activeSlot=${{ steps.slot.outputs.inactive }} \
            --reuse-values

      - name: Confirm active slot
        run: |
          echo "✅ Traffic now routing to slot: ${{ steps.slot.outputs.inactive }}"
          echo "   Image: ${{ steps.version.outputs.tag }}"

